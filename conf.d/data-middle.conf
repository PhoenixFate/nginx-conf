 server {
        listen 443;
        server_name data-middle.bytes-space.com;
        ssl_certificate /etc/nginx/cert/bytes-space.com.crt;
        ssl_certificate_key /etc/nginx/cert/bytes-space.com.key;
        ssl_session_timeout 5m;
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
        ssl_prefer_server_ciphers on;
        location / {
                root /usr/share/nginx/html/dataMiddle;
                index index.html;
        }
	location /prod-api/ {
        	proxy_set_header Host $http_host;
        	proxy_set_header X-Real-IP $remote_addr;
       		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        	proxy_set_header X-Forwarded-Proto $scheme;

		proxy_pass http://127.0.0.1:49612/;
	}
}
server {
        listen 80;
        server_name data-middle.bytes-space.com;
        rewrite ^/(.*)$ https://data-middle.bytes-space.com:443/$1 permanent;
}
